name: Release

on:
  push:
    tags: ["v*"]
  # 手动触发：不打 tag 也能干跑 Windows / macOS 构建验证产物（release job 会自动跳过）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Windows 桌面版构建：pytest -> PyInstaller 便携目录 -> zip -> Inno Setup 安装包 -> SHA256
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    # 构建只需读代码与上传产物；创建 Release 的写权限留给下方 release job
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          # 桌面依赖也纳入缓存 key，避免 requirements-desktop.txt 变更后命中过期缓存
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
      # 桌面打包需要 pywebview 等额外依赖（requirements-desktop.txt）
      - run: pip install -r requirements.txt -r requirements-desktop.txt
      - run: python -m pytest
      # 版本号三处同步：从 tag 生成（src/__init__.py / version_info.txt /
      # installer.iss），替代发版前的手工同步；干跑（非 tag 触发）时跳过
      - name: 同步版本号
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == v* ]]; then
            python scripts/sync_version.py "$TAG"
          else
            echo "非 tag 触发（${TAG}），跳过版本同步"
          fi
      # onedir 打包，产出 dist/CampusRunningGenerator/（GUI + CLI 双入口）
      - run: pyinstaller campus_running.spec --noconfirm --clean
      # 版本号：tag 触发时 GITHUB_REF_NAME 形如 v1.2.3；workflow_dispatch 干跑时
      # 是分支名（不以 v 开头），统一兜底为 0.0.0-dev，
      # 保证 iss 与产物文件名始终拿到合法版本字符串
      - name: 计算产物版本号
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME}"
          [[ "$VER" == v* ]] || VER="0.0.0-dev"
          echo "APP_VERSION=${VER}" >> "${GITHUB_ENV}"
      # 便携版 zip：整目录压缩、解压即用；输出到 dist/ 与安装包同目录，
      # 使 upload-artifact 以 dist 为根、下载后三个产物平铺便于 release 直接引用
      - name: 打包便携版 zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/CampusRunningGenerator -DestinationPath "dist/CampusRunningGen-${env:APP_VERSION}-win64.zip"
      # Inno Setup 6（choco 包名 innosetup）
      - run: choco install innosetup -y
      # /D 注入版本号覆盖 iss 内默认值（iss 内有 #ifndef 守卫），产出
      # dist/CampusRunningGen-Setup-<版本>-win64.exe（per-user 免管理员安装包）
      - name: 构建 Inno Setup 安装包
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${env:APP_VERSION}" installer.iss
      # 两个产物的 SHA256，格式与 sha256sum -c 兼容：<hash>＋两空格＋文件名，
      # LF 换行、无 BOM
      - name: 生成 SHA256 校验和
        shell: pwsh
        run: |
          $files = @(
            "dist/CampusRunningGen-${env:APP_VERSION}-win64.zip",
            "dist/CampusRunningGen-Setup-${env:APP_VERSION}-win64.exe"
          )
          $lines = foreach ($f in $files) {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $f).Hash, (Split-Path -Leaf $f)
          }
          [IO.File]::WriteAllText("dist/SHA256SUMS.txt", ($lines -join "`n") + "`n")
      # 干跑（workflow_dispatch）时也可从 Actions 页面手动下载产物检查
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            dist/CampusRunningGen-${{ env.APP_VERSION }}-win64.zip
            dist/CampusRunningGen-Setup-${{ env.APP_VERSION }}-win64.exe
            dist/SHA256SUMS.txt

  # macOS 桌面版构建：pytest -> PyInstaller arm64 .app（含 Dock 图标） -> 验证架构/签名/CLI -> zip -> SHA256
  build-macos:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
      # macos-15 必须提供原生 arm64 runner；若 GitHub 标签未来改回 x64，
      # 宁可构建失败也不能悄悄发布架构不符的产物
      - name: 确认 runner 是 arm64
        run: |
          arch="$(uname -m)"
          echo "runner architecture: ${arch}"
          test "${arch}" = "arm64"
      - run: pip install -r requirements.txt -r requirements-desktop.txt
      - run: python -m pytest
      - name: 同步版本号
        env:
          PYTHONIOENCODING: utf-8
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == v* ]]; then
            python scripts/sync_version.py "$TAG"
          else
            echo "非 tag 触发（${TAG}），跳过版本同步"
          fi
      - run: pyinstaller campus_running.spec --noconfirm --clean
      - name: 计算产物版本号
        run: |
          VER="${GITHUB_REF_NAME}"
          [[ "$VER" == v* ]] || VER="0.0.0-dev"
          echo "APP_VERSION=${VER}" >> "${GITHUB_ENV}"
      - name: 验证构建产物
        run: |
          APP="dist/CampusRunningGen.app"
          test -x "$APP/Contents/MacOS/CampusRunningGen"
          test -x "$APP/Contents/MacOS/CampusRunningGenCLI"
          test "$(lipo -archs "$APP/Contents/MacOS/CampusRunningGen")" = "arm64"
          test "$(lipo -archs "$APP/Contents/MacOS/CampusRunningGenCLI")" = "arm64"
          # 图标必须随包分发且被 Info.plist 引用，缺失时 Dock 只显示默认 exec 图标
          test -f "$APP/Contents/Resources/icon.icns"
          test "$(plutil -extract CFBundleIconFile raw "$APP/Contents/Info.plist")" = "icon.icns"
          codesign --verify --deep --strict "$APP"
          "$APP/Contents/MacOS/CampusRunningGenCLI" --list-tracks > /dev/null
      # ditto 会保留 POSIX 可执行权限、资源元数据与 .app 结构（含签名）；
      # --keepParent 让解压后仍是完整 .app，双击即用
      - name: 打包 macOS zip
        run: |
          ditto -c -k --keepParent dist/CampusRunningGen.app \
            "dist/CampusRunningGen-${APP_VERSION}-macos-arm64.zip"
      - name: 生成 SHA256 校验和
        run: |
          cd dist
          shasum -a 256 "CampusRunningGen-${APP_VERSION}-macos-arm64.zip" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-desktop-arm64
          path: |
            dist/CampusRunningGen-${{ env.APP_VERSION }}-macos-arm64.zip
            dist/SHA256SUMS.txt

  # 发版：保留原有 pytest + extract_changelog 逻辑，下载双平台产物后
  # 创建带附件的 Release（仅 tag 触发时执行，干跑不建 Release）
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - run: python scripts/extract_changelog.py "${GITHUB_REF_NAME}" --output release_notes.md
      # 两个 artifact 各自放到独立目录，避免同名 SHA256SUMS.txt 覆盖
      - uses: actions/download-artifact@v4
        with:
          name: windows-desktop
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: macos-desktop-arm64
          path: release-assets/macos
      # 附件用「文件#显示名」语法命名，安装版排在最前
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 语义化版本的预发布 tag（如 v3.1.0-pr.1）含连字符：
          # 不加 --prerelease 会被当作正式版发布并抢占 latest
          FLAGS=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            FLAGS="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release_notes.md ${FLAGS} \
            "release-assets/windows/CampusRunningGen-Setup-${GITHUB_REF_NAME}-win64.exe#Windows Installer (x86_64, recommended)" \
            "release-assets/windows/CampusRunningGen-${GITHUB_REF_NAME}-win64.zip#Windows Portable (x86_64)" \
            "release-assets/macos/CampusRunningGen-${GITHUB_REF_NAME}-macos-arm64.zip#macOS Portable (arm64)" \
            "release-assets/windows/SHA256SUMS.txt#SHA256 Checksums (Windows x86_64)" \
            "release-assets/macos/SHA256SUMS.txt#SHA256 Checksums (macOS arm64)"
